[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-codex-bridge"
version = "0.1.0a2"
description = "Discovery and explicit bidirectional messaging between existing coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EASY1 Staking"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/easy1staking-com/claude-2-codex"
Issues = "https://github.com/easy1staking-com/claude-2-codex/issues"

[project.scripts]
agent-bridge = "claude_codex_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_codex_bridge = ["py.typed"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12"]
standalone = ["pyinstaller>=6.14"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
